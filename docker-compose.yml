name: nextalent

x-service-common: &service-common
  build:
    context: .
    dockerfile: docker/dotnet/Dockerfile
  restart: unless-stopped
  depends_on:
    sqlserver:
      condition: service_healthy
    sqlserver-init:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DATABASE:-NexTalentDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: ${RABBITMQ_USER}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD}

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: nextalent-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER en el archivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en el archivo .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  sqlserver:
    build:
      context: ./docker/sqlserver
    image: nextalent/sqlserver-fts:2025
    container_name: nextalent-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en el archivo .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Contenedor de un solo uso: crea la base y los esquemas y termina (Exited 0).
  sqlserver-init:
    image: nextalent/sqlserver-fts:2025
    pull_policy: never
    container_name: nextalent-sqlserver-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en el archivo .env}
    volumes:
      - ./docker/sqlserver/init:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$MSSQL_SA_PASSWORD\" -C -I -b -i /init/crear-esquemas.sql"]

  identidad:
    <<: *service-common
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROYECTO: src/Services/Identidad/NexTalent.Identidad.Api
        ASSEMBLY: NexTalent.Identidad.Api
    image: nextalent/identidad:dev
    container_name: nextalent-identidad
    environment:
      <<: *service-env
      ASPNETCORE_HTTP_PORTS: "5001"
      # Solo desarrollo: aplica migraciones y carga datos de prueba al arrancar.
      DatabaseSeed__RunInitializers: "true"

  vacantes:
    <<: *service-common
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROYECTO: src/Services/Vacantes/NexTalent.Vacantes.Api
        ASSEMBLY: NexTalent.Vacantes.Api
    image: nextalent/vacantes:dev
    container_name: nextalent-vacantes
    environment:
      <<: *service-env
      ASPNETCORE_HTTP_PORTS: "5002"
      # Solo desarrollo: aplica migraciones y carga datos de prueba al arrancar.
      DatabaseSeed__RunInitializers: "true"
      DatabaseSeed__SeedBenchmark50k: "false"

  postulaciones:
    <<: *service-common
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROYECTO: src/Services/Postulaciones/NexTalent.Postulaciones.Api
        ASSEMBLY: NexTalent.Postulaciones.Api
    image: nextalent/postulaciones:dev
    container_name: nextalent-postulaciones
    environment:
      <<: *service-env
      ASPNETCORE_HTTP_PORTS: "5003"
      # Backend 2. Base, JWT y RabbitMQ: valores del .env (ver .env.example).
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DATABASE:-NexTalentDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: ${JWT_ISSUER:-NexTalent.Identidad}
      Jwt__Audience: ${JWT_AUDIENCE:-NexTalent.Api}
      Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el archivo .env}
      Interno__ApiKey: ${INTERNO_API_KEY:?Falta INTERNO_API_KEY en el archivo .env}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?Falta RABBITMQ_USER en el archivo .env}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en el archivo .env}
      # Solo desarrollo: aplica migraciones y carga datos de prueba al arrancar.
      DatabaseSeed__RunInitializers: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notificaciones:
    <<: *service-common
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROYECTO: src/Services/Notificaciones/NexTalent.Notificaciones.Api
        ASSEMBLY: NexTalent.Notificaciones.Api
    image: nextalent/notificaciones:dev
    container_name: nextalent-notificaciones
    environment:
      <<: *service-env
      ASPNETCORE_HTTP_PORTS: "5004"
      # Backend 2. Base, JWT y RabbitMQ: valores del .env (ver .env.example).
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DATABASE:-NexTalentDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: ${JWT_ISSUER:-NexTalent.Identidad}
      Jwt__Audience: ${JWT_AUDIENCE:-NexTalent.Api}
      Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el archivo .env}
      Interno__ApiKey: ${INTERNO_API_KEY:?Falta INTERNO_API_KEY en el archivo .env}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?Falta RABBITMQ_USER en el archivo .env}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en el archivo .env}
      # Solo desarrollo: aplica migraciones y carga datos de prueba al arrancar.
      DatabaseSeed__RunInitializers: "true"
      Servicios__PostulacionesUrl: http://postulaciones:5003
      Whatsapp__VerifyToken: ${WHATSAPP_VERIFY_TOKEN:-}
      Whatsapp__AppSecret: ${WHATSAPP_APP_SECRET:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: docker/dotnet/Dockerfile
      args:
        PROYECTO: src/Gateway/NexTalent.Gateway
        ASSEMBLY: NexTalent.Gateway
    image: nextalent/gateway:dev
    container_name: nextalent-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5000"
      ReverseProxy__Clusters__identidad__Destinations__principal__Address: http://identidad:5001
      ReverseProxy__Clusters__vacantes__Destinations__principal__Address: http://vacantes:5002
      ReverseProxy__Clusters__postulaciones__Destinations__principal__Address: http://postulaciones:5003
      ReverseProxy__Clusters__notificaciones__Destinations__principal__Address: http://notificaciones:5004
    depends_on:
      identidad:
        condition: service_started
      vacantes:
        condition: service_started
      postulaciones:
        condition: service_started
      notificaciones:
        condition: service_started

volumes:
  rabbitmq-data:
  sqlserver-data:
