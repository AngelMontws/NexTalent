/* NexTalent v3 · correcciones de desbordamiento y jerarquía */
html,body{max-width:100%;overflow-x:clip}
#root,.postulacion,.estructura,.area-trabajo,main,form,section,article,.panel,.pagina-perfil,.distribucion-notificaciones{min-width:0;max-width:100%}
*{overflow-wrap:break-word}
/* Contenedor de contenido con borde. */
.panel{overflow-wrap:anywhere}
input,textarea,select{max-width:100%;min-width:0}
.boton{white-space:normal;line-height:1.4;text-align:center}
/* Cabecera con acciones y datos de usuario. */
.cabecera .derecha-cabecera{min-width:0;flex-wrap:nowrap;gap:6px}
.etiqueta-usuario{display:block;max-width:140px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.barra-lateral{overflow-y:auto;overscroll-behavior:contain}
.rejilla-busqueda>*{min-width:0}
.tarjeta-vacante{overflow-wrap:anywhere}
.tarjeta-vacante .parte-inferior{flex-wrap:wrap}
/* Cuadro emergente. */
.ventana{max-height:min(90vh,930px);overflow-y:auto;overscroll-behavior:contain}

.fondo-ventana{padding:14px;align-items:center}
/* Distribución de archivos de postulación. */
.rejilla-documentos .campo-documento{min-width:0;overflow:hidden}
.distribucion-acceso,.contenido-acceso,.campos-registro,.formulario-acceso,.campos-registro label{min-width:0}

}
estadoInterfaz.datosPerfil={nombre:'Alex',paterno:'Rivera',materno:'',edad:'',ocupacion:'',curp:'',calle:'',numero:'',colonia:'',municipio:'Ciudad de México',estado:'CDMX',cp:'',celular:'',email:estadoInterfaz.correoCuenta};
estadoInterfaz.datosReclutador={nombre:'Reclutador NexTalent',empresa:'Impulso Digital',email:'reclutador@ejemplo.com',celular:'',aceptaWhatsapp:false,sitioWeb:leerDatos('nextalent-sitio-empresa-v1','')};

/** Permite solo enlaces externos HTTP o HTTPS. */
function enlaceSeguro(texto){try{const u=new URL(String(texto||'').trim());return ['https:','http:'].includes(u.protocol)&&u.hostname.includes('.')?u.href:''}catch{return ''}}
/** Muestra el nombre de la empresa como enlace si el reclutador añadió su sitio. */
function nombreEmpresaEnlazado(j){const sitio=j.sitioWeb||((j.empresa===estadoInterfaz.datosReclutador.empresa)?estadoInterfaz.datosReclutador.sitioWeb:'');const url=enlaceSeguro(sitio);return url?`<a href="${escaparHTML(url)}" target="_blank" rel="noopener noreferrer" data-enlace-empresa="true" class="enlace-empresa" title="Visitar la página web de ${escaparHTML(j.empresa)}">${escaparHTML(j.empresa)} ↗</a>`:escaparHTML(j.empresa)}
estadoInterfaz.fotoCandidato='';estadoInterfaz.fotoReclutador='';estadoInterfaz.bandejaWhatsapp=[];
let temporizadorAviso;function mostrarAviso(msg){let o=elementoPorId('toast');if(!o){o=document.createElement('div');o.id='toast';o.className='aviso-emergente';o.setAttribute('role','status');document.body.append(o)}o.textContent=msg;o.hidden=false;clearTimeout(temporizadorAviso);temporizadorAviso=setTimeout(()=>o.hidden=true,3500)}
/** Busca una vacante por identificador. */
const buscarVacante=id=>almacen.vacantes.find(j=>j.id===id);const vacantesActivas=()=>almacen.vacantes.filter(j=>j.activa&&new Date(j.fechaVencimiento).getTime()>=Date.now());const misPostulaciones=()=>almacen.postulaciones.filter(a=>a.idCandidato&&a.idCandidato===estadoInterfaz.idCuenta);const calcularCoincidencia=(job,skills=almacen.perfil.habilidades)=>Math.round(job.habilidades.filter(s=>skills.includes(s)).length/Math.max(1,job.habilidades.length)*100);const yaPostulado=j=>misPostulaciones().some(a=>a.idVacante===j.id);const obtenerIniciales=name=>name.split(' ').map(n=>n.charAt(0)).slice(0,2).join('').toUpperCase();

/** Dibuja una tarjeta de vacante. */
function tarjetaVacante(j){return `<article role="button" tabindex="0" aria-label="Ver detalles de ${escaparHTML(j.titulo)}" class="tarjeta-vacante ${estadoInterfaz.seleccionada===j.id?'seleccionado':''}" data-accion="select-job" data-identificador="${escaparHTML(j.id)}"><div class="fila-empresa"><span class="distintivo-empresa">${escaparHTML(obtenerIniciales(j.empresa))}</span><div style="flex:1"><div class="nombre-empresa">${nombreEmpresaEnlazado(j)}</div><div class="verificado">✓ Empresa verificada</div></div><span class="texto-tenue texto-minimo">${diasPorEtapa(j.fechaCreacion)} d</span></div><div class="titulo-vacante">${escaparHTML(j.titulo)}</div><div class="salario">${formatearMoneda(j.min)} – ${formatearMoneda(j.max)} MXN</div><div class="texto-tenue texto-pequeno">⌖ ${escaparHTML(j.ubicacion)} · ${escaparHTML(j.modalidad)} · ${escaparHTML(j.jornada)}</div><div class="flexible permitir-salto separacion-8" style="margin-top:11px">${j.habilidades.slice(0,3).map(s=>`<span class="etiqueta">${escaparHTML(s)}</span>`).join('')}</div><div class="parte-inferior"><span class="texto-tenue texto-pequeno">Vacante activa</span><span class="texto-tenue texto-pequeno">Ver detalles →</span></div></article>`}
/** Muestra las características y el salario de una vacante. */
function detalleVacante(j){if(!j)return `<div class="panel sin-resultados">Selecciona una vacante para conocer sus detalles.</div>`;let applied=yaPostulado(j);return `<div class="regreso-movil"><button class="boton" data-accion="back-results">← Volver a resultados</button></div><article class="panel detalle"><div class="cabecera-detalle"><div class="fila-empresa"><span class="distintivo-empresa">${escaparHTML(obtenerIniciales(j.empresa))}</span><div><div class="nombre-empresa">${nombreEmpresaEnlazado(j)}</div><div class="verificado">✓ Empresa verificada</div></div></div><h2 style="font-size:21px;margin:17px 0 10px">${escaparHTML(j.titulo)}</h2><div class="texto-tenue texto-pequeno">⌖ ${escaparHTML(j.ubicacion)} · ${escaparHTML(j.modalidad)} · ${escaparHTML(j.jornada)}</div><div class="salario" style="font-size:21px;margin-top:16px">${formatearMoneda(j.min)} – ${formatearMoneda(j.max)}</div><p class="texto-tenue texto-minimo">MXN mensuales · ${escaparHTML(j.tipoSalario).toLowerCase()}</p><button class="boton principal ancho-total" data-accion="${applied?'go-apps':'open-apply'}">${applied?'✓ Ya te postulaste · Ver seguimiento':'▣ Postularme ahora →'}</button><p class="texto-tenue texto-minimo" style="text-align:center;margin-top:9px">${applied?'Tu folio ya está registrado':'Sin formularios largos · Perfil precargado'}</p></div><div class="cuerpo-detalle"><section><h3>Sobre esta oportunidad</h3><p>${escaparHTML(j.descripcion)}</p></section><section><h3>Habilidades requeridas</h3><div class="flexible permitir-salto">${j.habilidades.map(s=>`<span class="etiqueta ${almacen.perfil.habilidades.includes(s)?'verde':''}">${almacen.perfil.habilidades.includes(s)?'✓ ':''}${escaparHTML(s)}</span>`).join('')}</div></section><section><h3>Lo que harás</h3><ul><li>Colaborar en las actividades del puesto.</li><li>Comunicar avances y trabajar en equipo.</li><li>Documentar y mejorar procesos.</li></ul></section><section><h3>Seguridad y transparencia</h3><p>✓ Empresa verificada · Índice de respuesta: ${escaparHTML(j.indiceRespuesta)}%.</p><p>Vigente hasta el ${formatearFecha(j.fechaVencimiento)}.</p></section></div></article>`}
/** Construye los campos que filtran los resultados. */
function controlesFiltros(){
  const opciones=(clave,items,vacio)=>`<select class="campo" data-filtro="${clave}"><option value="">${vacio}</option>${items.map(x=>`<option value="${escaparHTML(x)}" ${estadoInterfaz.filtros[clave]===String(x)?'selected':''}>${escaparHTML(x)}</option>`).join('')}</select>`;
  const seleccionadas=estadoInterfaz.filtros.habilidades||[];
  // Cada casilla agrega o quita una habilidad sin borrar las anteriores.
  const habilidades=`<fieldset class="fila-filtros"><legend class="etiqueta-campo">Habilidades</legend><p class="texto-tenue texto-minimo">Se mostrarán vacantes que pidan todas las habilidades marcadas.</p><div class="lista-filtro-habilidades">${CATALOGO.map(h=>`<label class="opcion-filtro-habilidad"><input type="checkbox" data-filtro-habilidad="${escaparHTML(h)}" ${seleccionadas.includes(h)?'checked':''}><span>${escaparHTML(h)}</span></label>`).join('')}</div>${seleccionadas.length?`<span class="texto-tenue texto-minimo">${seleccionadas.length} seleccionada(s)</span>`:''}</fieldset>`;
  return `<div class="fila-filtros"><label class="etiqueta-campo">Ubicación</label>${opciones('ubicacion',[...new Set(vacantesActivas().map(j=>j.ubicacion))],'Todas las ubicaciones')}</div><div class="fila-filtros"><label class="etiqueta-campo">Modalidad</label>${opciones('modalidad',['Remoto','Híbrido','Presencial'],'Todas las modalidades')}</div><div class="fila-filtros"><label class="etiqueta-campo">Salario mínimo</label>${opciones('min',['10000','15000','20000','25000','30000'],'Cualquier salario')}</div>${habilidades}<div class="fila-filtros"><label class="etiqueta-campo">Jornada</label>${opciones('jornada',['Tiempo completo','Medio tiempo','Por turnos'],'Todas las jornadas')}</div><button class="boton ancho-total" data-accion="clear-filters">Limpiar filtros</button>`;
}
/** Comprueba si una vacante cumple los filtros elegidos. */
function coincideConFiltros(j){const f=estadoInterfaz.filtros,t=estadoInterfaz.busqueda.toLowerCase();return [j.titulo,j.empresa,j.ubicacion,...j.habilidades].join(' ').toLowerCase().includes(t)&&(!f.ubicacion||j.ubicacion===f.ubicacion)&&(!f.modalidad||j.modalidad===f.modalidad)&&(!f.jornada||j.jornada===f.jornada)&&(!(f.habilidades||[]).length||f.habilidades.every(h=>j.habilidades.includes(h)))&&(!f.min||j.max>=Number(f.min))}

function dibujarBusqueda(){let found=vacantesActivas().filter(coincideConFiltros),j=found.find(x=>x.id===estadoInterfaz.seleccionada)||found[0];if(j)estadoInterfaz.seleccionada=j.id;return encabezadoSeccion('Explora oportunidades',`Hola, ${escaparHTML(estadoInterfaz.nombreCuenta.split(' ')[0])} 👋`,'Encuentra empleos con salario visible, empresas verificadas y seguimiento real de tu postulación.',`<span class="etiqueta-destacada">✦ ${misPostulaciones().length} postulaciones en tu perfil</span>`)+`<div class="barra-busqueda"><span class="icono-busqueda">⌕</span><input id="job-search" class="campo" placeholder="Puesto, empresa o habilidad…" aria-label="Buscar vacantes" autocomplete="off" value="${escaparHTML(estadoInterfaz.busqueda)}" /></div><div class="rejilla-busqueda ${estadoInterfaz.detalleMovil?'detalle-visible':''}"><aside class="panel panel-filtros"><h3>Filtrar vacantes ⚙</h3>${controlesFiltros()}</aside><div class="columna-vacantes"><div class="cabecera-lista"><strong class="texto-pequeno">${found.length} vacantes encontradas</strong><button class="boton filtros-moviles" data-accion="show-filters">☷ Filtros</button></div><div class="lista-vacantes">${found.map(tarjetaVacante).join('')||`<div class="panel sin-resultados">No se encontraron vacantes.<div style="margin-top:15px"><button class="boton" data-accion="clear-all">Restablecer búsqueda</button></div></div>`}</div></div><div>${detalleVacante(j)}</div></div>`}

/** Dibuja una postulación y su historial. */
function elementoPostulacion(a){let j=buscarVacante(a.idVacante);if(!j)return '';let ix=ETAPAS_PRINCIPALES.indexOf(a.estado),closed=ETAPAS.slice(5).includes(a.estado);return `<article class="panel solicitud"><div class="flexible entre-extremos permitir-salto separacion-8"><div><h2 style="font-size:17px">${escaparHTML(j.titulo)}</h2><p class="texto-tenue texto-pequeno" style="margin-top:6px">${escaparHTML(j.empresa)} · ${escaparHTML(j.ubicacion)}</p></div>${etiquetaPostulacion(a.estado)}</div><p class="texto-tenue texto-pequeno" style="margin-top:14px">${formatearMoneda(j.min)} – ${formatearMoneda(j.max)} · Folio <strong>${escaparHTML(a.folio)}</strong></p><div class="flexible entre-extremos alineado-centro permitir-salto separacion-8" style="margin-top:20px"><strong class="texto-minimo">SEGUIMIENTO</strong><span class="texto-tenue texto-minimo">◷ ${diasPorEtapa(a.fechaActualizacion)} día(s) en etapa</span></div><div class="progreso">${ETAPAS_PRINCIPALES.map((s,i)=>`<i class="${!closed&&i<=ix?'completado':''}" style="${a.estado==='Contratado'?'background:#16a34a':''}"></i>`).join('')}</div><div class="etiquetas-progreso">${ETAPAS_PRINCIPALES.map(s=>`<span>${escaparHTML(s)}</span>`).join('')}</div><div class="aviso" style="margin-top:18px">${closed?(a.estado==='Contratado'?'¡Proceso concluido con contratación!':'El proceso terminó. La empresa dejó una respuesta registrada.'):'Tu estatus se actualizará cuando el reclutador cambie la etapa.'}</div>${estadoInterfaz.historial.includes(a.id)?`<div class="historial-postulacion">${[...a.historial].reverse().map(h=>`<div>● <strong>${escaparHTML(h.estado)}</strong> · ${formatearFecha(h.fecha)}</div>`).join('')}</div>`:''}<div class="pie-postulacion"><span class="texto-tenue texto-minimo">▣ Enviada el ${formatearFecha(a.fechaCreacion)}</span><button class="boton discreto" data-accion="toggle-history" data-identificador="${escaparHTML(a.id)}">${estadoInterfaz.historial.includes(a.id)?'Ocultar historial':'Ver historial'} ↗</button></div></article>`}
/** Muestra el seguimiento de las postulaciones. */

/** Obtiene las postulaciones de la vacante seleccionada. */
function postulacionesTablero(){return almacen.postulaciones.filter(a=>a.idVacante===estadoInterfaz.vacanteKanban)}
/** Dibuja la tarjeta de un candidato. */
function tarjetaKanban(a){let j=buscarVacante(a.idVacante);return `<div class="tarjeta-candidato" data-postulacion="${escaparHTML(a.id)}" draggable="true"><div class="flexible alineado-centro separacion-8"><input type="checkbox" aria-label="Seleccionar a ${escaparHTML(a.candidato)}" data-seleccionar-postulacion="${escaparHTML(a.id)}" ${estadoInterfaz.postulacionesSeleccionadas.includes(a.id)?'checked':''}><button class="boton-nombre" data-accion="candidate-detail" data-identificador="${escaparHTML(a.id)}">${escaparHTML(a.candidato)}</button></div><p class="texto-tenue texto-minimo" style="margin-top:3px">${escaparHTML(a.folio)}</p><div class="metricas-candidatos"><span class="etiqueta dorado">${j?calcularCoincidencia(j,a.habilidades):0}% match</span><span class="texto-tenue texto-minimo">◷ ${diasPorEtapa(a.fechaActualizacion)} d</span></div><select class="campo" aria-label="Mover a ${escaparHTML(a.candidato)}" data-mover-postulacion="${escaparHTML(a.id)}">${ETAPAS.map(s=>`<option ${a.estado===s?'selected':''}>${escaparHTML(s)}</option>`).join('')}</select></div>`}
/** Muestra los candidatos organizados por etapas. */
function dibujarKanban(){let mine=almacen.vacantes.filter(j=>j.idEmpresa==='empresa-impulso'||(!j.idEmpresa&&j.empresa===estadoInterfaz.datosReclutador.empresa)),j=mine.find(x=>x.id===estadoInterfaz.vacanteKanban)||mine[0];if(j)estadoInterfaz.vacanteKanban=j.id;let all=postulacionesTablero();let filtered=all.filter(a=>[a.candidato,a.folio,...a.habilidades].join(' ').toLowerCase().includes(estadoInterfaz.busquedaKanban.toLowerCase()));let pending=all.filter(a=>!ETAPAS.slice(5).includes(a.estado));return encabezadoSeccion('','Tablero de candidatos','Administra tu proceso de selección por etapas y evita dejar postulaciones sin respuesta.',`<button class="boton principal" data-accion="go-publish">＋ Publicar vacante →</button>`)+`<div class="estadisticas-kanban"><div class="panel estadistica"><span>Candidatos</span><strong>${all.length}</strong></div><div class="panel estadistica"><span>Por revisar</span><strong>${all.filter(a=>['Enviada','Vista','En revisión'].includes(a.estado)).length}</strong></div><div class="panel estadistica"><span>En entrevista</span><strong>${all.filter(a=>a.estado==='Entrevista').length}</strong></div><div class="panel estadistica"><span>Sin movimiento*</span><strong>${pending.filter(a=>diasPorEtapa(a.fechaActualizacion)>=10).length}</strong></div></div><div class="panel filtro-kanban"><div><label class="etiqueta-campo">Vacante</label><select class="campo" id="kanban-job">${mine.map(x=>`<option value="${escaparHTML(x.id)}" ${x.id===estadoInterfaz.vacanteKanban?'selected':''}>${escaparHTML(x.titulo)}</option>`).join('')}</select></div><div><label class="etiqueta-campo">Buscar candidato o folio</label><input class="campo" id="kanban-query" placeholder="Nombre, habilidad, folio…" value="${escaparHTML(estadoInterfaz.busquedaKanban)}"></div><div class="texto-tenue texto-minimo" style="grid-column:1/-1">${j?`${escaparHTML(j.ubicacion)} · ${escaparHTML(j.modalidad)} · ${formatearMoneda(j.min)} – ${formatearMoneda(j.max)}`:''}</div></div>${estadoInterfaz.postulacionesSeleccionadas.length?`<div class="panel" style="margin-top:15px;padding:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><strong>${estadoInterfaz.postulacionesSeleccionadas.length} seleccionados</strong><select class="campo" id="bulk-stage" style="max-width:200px">${ETAPAS.map(s=>`<option ${estadoInterfaz.etapaMasiva===s?'selected':''}>${escaparHTML(s)}</option>`).join('')}</select><button class="boton principal" data-accion="bulk-move">Mover seleccionados</button><button class="boton" data-accion="clear-selection">Limpiar selección</button></div>`:''}<div class="pestanas-etapas" role="tablist">${ETAPAS.map(s=>`<button role="tab" aria-selected="${s===estadoInterfaz.etapaKanban}" class="${s===estadoInterfaz.etapaKanban?'seleccionado':''}" data-accion="kanban-stage" data-identificador="${escaparHTML(s)}">${escaparHTML(s)} (${filtered.filter(a=>a.estado===s).length})</button>`).join('')}</div><div class="contenedor-kanban"><div class="kanban">${ETAPAS.map(s=>`<section class="columna-kanban ${estadoInterfaz.etapaKanban===s?'active':''}" data-etapa="${escaparHTML(s)}" data-etapa-destino="${escaparHTML(s)}"><div class="titulo-columna"><span>${escaparHTML(s)}</span><span class="texto-tenue">${filtered.filter(a=>a.estado===s).length}</span></div>${filtered.filter(a=>a.estado===s).map(tarjetaKanban).join('')||'<p class="mensaje-vacio">Sin candidatos en esta etapa.</p>'}</section>`).join('')}</div></div><p class="texto-tenue texto-minimo" style="margin-top:13px">* Recordatorio propuesto a los 10 días hábiles. Puedes cambiar etapas con el selector o arrastrar tarjetas en escritorio. Los cambios se guardan localmente.</p>`}

const CAMPOS_PERSONALES=[
 ['nombre','Nombre(s)','text',true],['paterno','Apellido paterno','text',true],['materno','Apellido materno','text',true],
 ['edad','Edad','number',false],['ocupacion','Ocupación','text',true],['curp','CURP','text',false],
 ['calle','Calle','text',true],['numero','Número exterior','text',false],['colonia','Colonia','text',false],
 ['municipio','Municipio / alcaldía','text',false],['estado','Estado','text',false],['cp','Código postal','text',false],
 ['celular','Teléfono celular','tel',false],['email','Correo electrónico','email',true]
];
/** Obtiene la foto de perfil o un avatar alternativo. */
function fotografiaPerfil(){const src=estadoInterfaz.rol==='candidato'?estadoInterfaz.fotoCandidato:estadoInterfaz.fotoReclutador;
 return `<div class="avatar-perfil">${src?`<img src="${escaparHTML(src)}" alt="Foto de perfil">`:escaparHTML(obtenerIniciales(estadoInterfaz.rol==='candidato'?estadoInterfaz.nombreCuenta:estadoInterfaz.datosReclutador.nombre))}</div>`}
/** Muestra los campos para editar los datos de la cuenta. */
function dibujarPerfil(){const candidate=estadoInterfaz.rol==='candidato',data=candidate?estadoInterfaz.datosPerfil:estadoInterfaz.datosReclutador;
const input=(name,label,type,wide)=>`<label class="campo-perfil ${wide?'ocupa-dos':''}"><span class="etiqueta-campo">${escaparHTML(label)}</span><input class="campo" name="${name}" type="${type}" value="${escaparHTML(data[name]||'')}" ${name==='curp'?'maxlength="18"':name==='celular'?'maxlength="10"':name==='cp'?'maxlength="5"':''} placeholder="${escaparHTML(label)}" ${['nombre','paterno','celular','email'].includes(name)&&candidate?'required':''}></label>`;
const fields=candidate?CAMPOS_PERSONALES.map(f=>input(...f)).join(''):[['nombre','Nombre del reclutador','text',true],['empresa','Empresa','text',true],['email','Correo electrónico','email',true],['celular','Teléfono celular','tel',true],['sitioWeb','Página web de la empresa (enlace)','url',true]].map(f=>input(...f)).join('');
let whatsapp=candidate?!!almacen.perfil.aceptaWhatsapp:!!data.aceptaWhatsapp;
return `<div class="pagina-perfil">${encabezadoSeccion('Mi cuenta','Personalización de cuenta','Actualiza tu información, fotografía y las preferencias de notificación.',`<span class="etiqueta">${candidate?'Perfil de candidato':'Perfil de reclutador'}</span>`)}<form id="profile-form" class="bloques-perfil"><section class="panel seccion-perfil"><div class="introduccion-seccion"><h2>Foto de perfil</h2><p>Personaliza cómo aparece tu cuenta en NexTalent.</p></div><div class="fila-foto">${fotografiaPerfil()}<div class="ayuda-foto"><b>Tu fotografía</b><p class="texto-tenue texto-pequeno">JPG, PNG o WebP, hasta 2 MB. Se mantiene únicamente durante esta sesión.</p><div class="botones-foto"><label class="boton boton-archivo">▣ Cambiar fotografía<input type="file" accept="image/png,image/jpeg,image/webp" data-foto-perfil="true" aria-label="Seleccionar foto de perfil"></label><button type="button" class="boton discreto" data-accion="remove-photo">Quitar foto</button></div></div></div></section><section class="panel seccion-perfil"><div class="introduccion-seccion"><h2>${candidate?'Información personal':'Datos del reclutador'}</h2><p>${candidate?'Revisa tus datos de contacto y dirección.':'Configura tus datos y el número que recibirá avisos.'}</p></div><div class="rejilla-perfil">${fields}</div>${candidate?'':'<p class="texto-tenue texto-minimo" style="margin-top:12px">El nombre de tu empresa abrirá este enlace para los candidatos.</p>'}</section><section class="panel seccion-perfil"><div class="introduccion-seccion"><h2>Notificaciones de WhatsApp</h2><p>${candidate?'Avisos cuando cambie el estado de tus postulaciones.':'Avisos cuando un candidato solicite una vacante.'}</p></div><label class="consentimiento"><input type="checkbox" name="whatsapp" ${whatsapp?'checked':''}><span><b>Autorizo recibir notificaciones por WhatsApp.</b><small>Los mensajes automáticos requieren conexión al servidor. Activa esta opción y guarda un teléfono válido para preparar mensajes.</small></span></label></section><div class="guardar-perfil"><div class="texto-tenue texto-pequeno">Privacidad: CURP, dirección, teléfono y fotografía no se envían a un servidor; los cambios privados de esta pantalla solo viven durante la sesión.</div><button class="boton principal" type="submit">✓ Guardar cambios</button></div></form></div>`;
}
/** Prepara el texto informativo de WhatsApp. */
function mensajeWhatsApp(n){return `NexTalent | Nueva postulación\nCandidato: ${n.candidato}\nVacante: ${n.titulo}\nEmpresa: ${n.empresa}\nFolio: ${n.folio}\nRevisa el apartado Postulaciones para dar seguimiento.`}
/** Muestra las postulaciones nuevas para el reclutador. */
function dibujarNotificaciones(){let notices=estadoInterfaz.bandejaWhatsapp,selected=notices.find(n=>n.folio===estadoInterfaz.waSelected)||notices[0],phone=estadoInterfaz.datosReclutador.celular,enabled=!!estadoInterfaz.datosReclutador.aceptaWhatsapp&&/^\d{10}$/.test(phone);
return `<div class="pagina-perfil">${encabezadoSeccion('Reclutamiento','Notificaciones','Revisa las postulaciones recibidas. Prepara un mensaje de WhatsApp si autorizaste el canal.',`<button class="boton" data-accion="go-profile">⚙ Configurar WhatsApp</button>`)}<div class="distribucion-notificaciones"><section class="panel seccion-perfil"><div class="flexible entre-extremos alineado-centro separacion-8 permitir-salto"><h2 class="titulo-seccion">Bandeja de postulaciones</h2><span class="etiqueta">${notices.length} nuevas</span></div>${notices.length?`<div class="lista-avisos">${notices.map(n=>`<button class="elemento-aviso ${selected&&n.folio===selected.folio?'seleccionado':''}" data-accion="select-notice" data-identificador="${escaparHTML(n.folio)}"><span class="icono-aviso">✉</span><span class="texto-aviso"><b>${escaparHTML(n.candidato)}</b><span>${escaparHTML(n.titulo)} · ${escaparHTML(n.empresa)}</span><small>${escaparHTML(n.folio)} · ${formatearFecha(n.fecha)}</small></span></button>`).join('')}</div>`:`<div class="notificaciones-vacias"><div>🔔</div><h3>Aún no hay avisos nuevos</h3><p>Prueba una postulación desde la vista Candidato; el reclutador verá aquí la notificación de la postulación.</p></div>`}</section><section class="panel seccion-perfil"><div class="flexible alineado-centro separacion-8"><span class="icono-aviso">◉</span><h2 class="titulo-seccion">Mensaje para WhatsApp</h2></div><div class="vista-whatsapp">${selected?escaparHTML(mensajeWhatsApp(selected)).replace(/\n/g,'<br>'):'Los detalles de la siguiente postulación aparecerán aquí.'}</div><div class="acciones-whatsapp"><button type="button" class="boton" data-accion="copy-whatsapp" ${!selected?'disabled':''}>▣ Copiar aviso</button><button type="button" class="boton principal" data-accion="open-whatsapp" ${!selected||!enabled?'disabled':''}>◉ Abrir WhatsApp</button></div><div class="aviso texto-tenue texto-pequeno">${enabled?'Se abrirá WhatsApp con el texto preparado. Debes pulsar Enviar manualmente.':'Configura un celular de 10 dígitos y activa tu consentimiento desde Mi cuenta para habilitar WhatsApp.'}<br><strong>Los avisos automáticos requieren conexión al servidor; los documentos seleccionados no se envían.</strong></div></section></div></div>`;
}

/** Construye el menú según el tipo de cuenta. */
function barraNavegacion(){let pages=estadoInterfaz.rol==='candidato'?[['search','⌕','Buscar vacantes'],['applications','▤','Mis postulaciones'],['profile','⚙','Mi cuenta']]:[['kanban','▦','Postulaciones'],['publish','＋','Publicar vacante'],['notifications','♧','Notificaciones'],['profile','⚙','Mi cuenta']];return {pages,desktop:pages.map(([id,ico,label])=>`<button data-accion="nav" data-identificador="${id}" class="${estadoInterfaz.pagina===id?'seleccionado':''}"><span style="font-size:18px">${ico}</span>${label}${id==='applications'?`<span style="margin-left:auto">${misPostulaciones().length}</span>`:''}</button>`).join(''),mobile:pages.map(([id,ico,label])=>`<button data-accion="nav" data-identificador="${id}" class="${estadoInterfaz.pagina===id?'seleccionado':''}"><b>${ico}</b>${label}</button>`).join('')+`<button data-accion="switch-role" data-identificador="${estadoInterfaz.rol==='candidato'?'reclutador':'candidato'}"><b>⇄</b>Cambiar rol</button>`}}

const TIPOS_DOCUMENTO=[
 ['cv','Currículum vitae (CV)','PDF, DOC o DOCX',' .pdf,.doc,.docx',true],
 ['letter1','Carta de recomendación 1','PDF o imagen','.pdf,.png,.jpg,.jpeg',false],
 ['letter2','Carta de recomendación 2','PDF o imagen','.pdf,.png,.jpg,.jpeg',false],
 ['letter3','Carta de recomendación 3','PDF o imagen','.pdf,.png,.jpg,.jpeg',false],
 ['degree','Título universitario','Copia PDF o imagen','.pdf,.png,.jpg,.jpeg',false],
 ['license','Cédula profesional','Copia PDF o imagen','.pdf,.png,.jpg,.jpeg',false]
];
/** Construye los controles para adjuntar CV y comprobantes. */
function camposDocumentos(){return `<div class="titulo-documentos"><b>▣ Documentos para tu postulación</b><span class="texto-tenue texto-minimo">Los archivos se seleccionan en el navegador; no se envían a ningún servidor.</span></div><p class="texto-tenue texto-minimo" style="margin:7px 0 13px">CV obligatorio. Tres cartas, título y cédula disponibles para adjuntar cuando apliquen. Máximo 5 MB por archivo.</p><div class="rejilla-documentos">${TIPOS_DOCUMENTO.map(d=>`<label class="campo-documento"><b>${escaparHTML(d[1])}${d[4]?' *':''}</b><small class="texto-tenue">${escaparHTML(d[2])}</small><span class="nombre-documento" id="filename-${d[0]}">${estadoInterfaz.archivosAdjuntos[d[0]]?escaparHTML(estadoInterfaz.archivosAdjuntos[d[0]].name):'Seleccionar archivo'}</span><input type="file" data-documento="${d[0]}" accept="${d[3].trim()}" aria-label="${escaparHTML(d[1])}"></label>`).join('')}</div>`}
/** Valida tipo y tamaño del archivo seleccionado. */
function alCambiarArchivo(target){const k=target.dataset.documento,f=target.files&&target.files[0];if(!f)return;const def=TIPOS_DOCUMENTO.find(x=>x[0]===k),ext='.'+(f.name.split('.').pop()||'').toLowerCase();if(!def||!def[3].split(',').map(x=>x.trim()).includes(ext)){mostrarAviso('Formato de archivo no permitido');target.value='';return}if(f.size>5*1024*1024){mostrarAviso('Máximo 5 MB por documento');target.value='';return}estadoInterfaz.archivosAdjuntos[k]=f;const n=elementoPorId('filename-'+k);if(n)n.textContent=f.name;const err=elementoPorId('document-error');if(err)err.textContent=''}

/** Muestra formularios emergentes de postulación y confirmación. */
function dibujarVentanas(){const o=elementoPorId('overlays');if(estadoInterfaz.filtrosMoviles){o.innerHTML=`<div class="fondo-ventana" data-accion="overlay"><div class="ventana" role="dialog" aria-modal="true" aria-label="Filtros de vacantes"><div class="encabezado-ventana"><h2>Filtros de búsqueda</h2><button class="boton-icono" data-accion="close-overlay" aria-label="Cerrar">×</button></div>${controlesFiltros()}<button class="boton principal ancho-total" style="margin-top:12px" data-accion="close-overlay">Ver resultados</button></div></div>`;return}
if(!estadoInterfaz.modal){o.innerHTML='';return}
let body='',heading='';if(estadoInterfaz.modal==='apply'){const job=buscarVacante(estadoInterfaz.seleccionada);if(!job){estadoInterfaz.modal=null;return}heading='Confirmar postulación';body=`<div class="aviso"><strong>${escaparHTML(job.titulo)}</strong><br>${escaparHTML(job.empresa)} · ${formatearMoneda(job.min)} – ${formatearMoneda(job.max)}</div><p style="margin:17px 0 8px"><strong>Tu perfil se enviará con:</strong></p><p class="texto-tenue texto-pequeno" style="line-height:1.8">${escaparHTML(estadoInterfaz.nombreCuenta)}<br>${escaparHTML(estadoInterfaz.correoCuenta)}<br>${escaparHTML(almacen.perfil.ubicacion)}</p><div class="flexible permitir-salto separacion-8" style="margin:13px 0 18px">${almacen.perfil.habilidades.slice(0,6).map(s=>`<span class="etiqueta">${escaparHTML(s)}</span>`).join('')}</div><label class="flexible separacion-8" style="align-items:start;border:1px solid var(--line);padding:13px;border-radius:12px;margin-bottom:18px"><input type="checkbox" id="whatsapp-opt" ${almacen.perfil.aceptaWhatsapp?'checked':''}><span class="texto-pequeno"><b>Avisos por WhatsApp (opcional)</b><br><span class="texto-tenue texto-minimo">Autorizo avisos sobre el proceso. La preferencia queda guardada; el envío necesita conexión al servidor.</span></span></label>${camposDocumentos()}<p id="document-error" class="error texto-minimo" style="margin-bottom:12px;min-height:0"></p><button class="boton principal ancho-total" data-accion="confirm-apply">✓ Confirmar y postularme</button>`}
else if(estadoInterfaz.modal==='success'){heading='¡Postulación enviada!';body=`<div style="text-align:center"><div style="font-size:55px;color:#CD9901">✓</div><p style="margin:9px 0 18px;line-height:1.7" class="texto-tenue">Tu perfil se registró correctamente. Conserva este folio:</p><div class="aviso" style="font-size:23px;font-weight:850;letter-spacing:2px">${escaparHTML(estadoInterfaz.folio)}</div><div class="flexible separacion-8" style="margin-top:20px"><button class="boton ancho-total" data-accion="close-modal">Seguir buscando</button><button class="boton principal ancho-total" data-accion="go-apps">Mis postulaciones →</button></div></div>`}
else if(estadoInterfaz.modal==='candidato'){const a=almacen.postulaciones.find(v=>v.id===estadoInterfaz.openCandidate),j=a&&buscarVacante(a.idVacante);if(!a){estadoInterfaz.modal=null;return}heading='Perfil del candidato';body=`<h3>${escaparHTML(a.candidato)}</h3><p class="texto-tenue texto-pequeno" style="margin:6px 0 15px">${escaparHTML(a.folio)} · Ciudad de México</p><div class="flexible separacion-8" style="margin-bottom:16px">${etiquetaPostulacion(a.estado)}<span class="etiqueta dorado">${j?calcularCoincidencia(j,a.habilidades):0}% match</span></div><strong class="texto-pequeno">Habilidades</strong><div class="flexible permitir-salto separacion-8" style="margin:10px 0 20px">${a.habilidades.map(s=>`<span class="etiqueta">${escaparHTML(s)}</span>`).join('')}</div><strong class="texto-pequeno">Historial de estado</strong><div class="historial-postulacion">${[...a.historial].reverse().map(h=>`<div>● ${escaparHTML(h.estado)} · ${formatearFecha(h.fecha)}</div>`).join('')}</div><div style="margin-top:19px"><label class="etiqueta-campo">Mover a etapa</label><select class="campo" data-mover-postulacion="${escaparHTML(a.id)}">${ETAPAS.map(s=>`<option ${a.estado===s?'selected':''}>${escaparHTML(s)}</option>`).join('')}</select></div><button class="boton principal ancho-total" style="margin-top:17px" data-accion="close-modal">Cerrar detalle</button>`}
else if(estadoInterfaz.modal==='published'){heading='¡Vacante publicada!';body=`<div class="aviso">La vacante ya está disponible en la búsqueda del candidato y vence en 30 días.</div><div class="flexible separacion-8" style="margin-top:22px"><button class="boton ancho-total" data-accion="go-search">Ver vacante</button><button class="boton principal ancho-total" data-accion="go-kanban">Ir a Postulaciones →</button></div>`}
else if(estadoInterfaz.modal==='reset'){heading='Restaurar datos';body=`<p class="texto-tenue" style="line-height:1.8;margin-bottom:22px">Esto eliminará las publicaciones y postulaciones creadas en esta sesión y restaurará los datos de ejemplo.</p><div class="flexible separacion-8"><button class="boton ancho-total" data-accion="close-modal">Cancelar</button><button class="boton principal ancho-total" data-accion="confirm-reset">Restaurar datos</button></div>`}
o.innerHTML=`<div class="fondo-ventana" data-accion="overlay"><div class="ventana ${estadoInterfaz.modal==='apply'?'doc-modal':''}" role="dialog" aria-modal="true" aria-label="${escaparHTML(heading)}"><div class="encabezado-ventana"><h2>${escaparHTML(heading)}</h2><button class="boton-icono" data-accion="close-modal" aria-label="Cerrar">×</button></div>${body}</div></div>`}
/** Cambia de sección y actualiza la pantalla. */

function mostrarErrorAcceso(msg){const e=document.getElementById('auth-error');e.textContent=msg;e.style.display='block';document.getElementById('auth-success').style.display='none'}
/** Muestra una confirmación del acceso. */
function mostrarExitoAcceso(msg){const e=document.getElementById('auth-success');e.textContent=msg;e.style.display='block';document.getElementById('auth-error').style.display='none'}
/** Activa una cuenta de demostración. */
function entrarCuenta(role,name,email,registro=null){
  estadoInterfaz.idCuenta=identificadorCuenta(email);
  const existente=almacen.perfilesPorCuenta[estadoInterfaz.idCuenta];
  const nombreVisible=registro?[registro.nombre,registro.paterno,registro.materno].join(' ').trim():existente?.name||name;
  estadoInterfaz.nombreCuenta=nombreVisible;
  estadoInterfaz.correoCuenta=email;
  // Reemplazar el perfil activo impide heredar habilidades y permisos de otra cuenta.
  almacen.perfil={...perfilEjemplo,name:nombreVisible,email,...(existente||{})};
  if(registro){
    almacen.perfil.ubicacion=[registro.municipio,registro.estado].filter(Boolean).join(', ');
    almacen.perfil.aceptaWhatsapp=!!registro.whatsapp;
  }
  if(role==='candidato'){
    estadoInterfaz.datosPerfil={nombre:nombreVisible.split(' ')[0]||'',paterno:nombreVisible.split(' ')[1]||'',materno:nombreVisible.split(' ').slice(2).join(' '),edad:'',ocupacion:'',curp:'',calle:'',numero:'',colonia:'',municipio:'',estado:'',cp:'',celular:'',email};
    if(registro){for(const campo of ['nombre','paterno','materno','edad','ocupacion','curp','calle','numero','colonia','municipio','estado','cp','celular'])estadoInterfaz.datosPerfil[campo]=String(registro[campo]||'');}
  }else estadoInterfaz.datosReclutador.email=email;
  estadoInterfaz.rol=role;estadoInterfaz.pagina=role==='candidato'?'search':'kanban';estadoInterfaz.menuMovil=false;
  if(registro){guardarPreferenciaCuenta();guardarDatos();}
  raizAcceso.hidden=true;document.body.classList.remove('acceso-bloqueado');dibujarInterfaz();window.scrollTo(0,0);
}
/** Cierra la cuenta simulada y vuelve al login. */
function cerrarSesionDemo(){estadoInterfaz.idCuenta='';almacen.perfil={...perfilEjemplo};estadoInterfaz.datosPerfil={nombre:'',paterno:'',materno:'',edad:'',ocupacion:'',curp:'',calle:'',numero:'',colonia:'',municipio:'',estado:'',cp:'',celular:'',email:''};mostrarAcceso('login')}
raizAcceso.addEventListener('click',e=>{const t=e.target.closest('[data-acceso]');if(!t)return;const a=t.dataset.acceso;if(a==='login'||a==='register'||a==='forgot')mostrarAcceso(a);if(a==='refresh-captcha'){nuevoCaptcha();const q=raizAcceso.querySelector('#captcha-text');if(q)q.textContent=`${preguntaAcceso.a} + ${preguntaAcceso.b} = ?`;const a=raizAcceso.querySelector('[name="captcha"]');if(a)a.value=''}if(a==='theme'){estadoInterfaz.oscuro=!estadoInterfaz.oscuro;document.documentElement.classList.toggle('dark',estadoInterfaz.oscuro);try{localStorage.setItem('nextalent-preview-dark',JSON.stringify(estadoInterfaz.oscuro))}catch{}t.textContent=estadoInterfaz.oscuro?'☀ Modo claro':'☾ Modo oscuro'}if(a==='demo-candidate')entrarCuenta('candidato','Alex Rivera','alex.rivera@ejemplo.com');if(a==='demo-recruiter')entrarCuenta('reclutador','Reclutador NexTalent','reclutador@ejemplo.com')});
raizAcceso.addEventListener('submit',e=>{const form=e.target.closest('[data-formulario-acceso]');if(!form)return;e.preventDefault();const d=Object.fromEntries(new FormData(form));if(String(d.captcha||'').trim()!==String(preguntaAcceso.a+preguntaAcceso.b)){mostrarErrorAcceso('CAPTCHA incorrecto. Vuelve a intentarlo.');nuevoCaptcha();raizAcceso.querySelector('#captcha-text').textContent=`${preguntaAcceso.a} + ${preguntaAcceso.b} = ?`;form.querySelector('[name="captcha"]').value='';return}
if(form.dataset.formularioAcceso==='forgot'){if(!/^\S+@\S+\.\S+$/.test(String(d.email||''))){mostrarErrorAcceso('Escribe un correo válido.');return}mostrarExitoAcceso('Recuperación simulada. No se envió ningún correo.');return}
if(form.dataset.formularioAcceso==='login'){if(!/^\S+@\S+\.\S+$/.test(String(d.email||''))||String(d.password||'').length<8){mostrarErrorAcceso('Escribe un correo válido y una contraseña de 8 caracteres o más.');return}entrarCuenta(d.rol==='reclutador'?'reclutador':'candidato',d.rol==='reclutador'?'Reclutador NexTalent':'Alex Rivera',String(d.email));return}
let required=['nombre','paterno','materno','edad','ocupacion','curp','calle','numero','colonia','municipio','estado','cp','celular','email','password','confirm'];
if(required.some(k=>!String(d[k]||'').trim())){mostrarErrorAcceso('Completa todos los campos obligatorios.');return}if(Number(d.edad)<18||Number(d.edad)>100){mostrarErrorAcceso('La edad debe estar entre 18 y 100 años.');return}if(!/^[A-Z]{4}\d{6}[HM][A-Z]{5}[A-Z\d]\d$/i.test(String(d.curp).trim())){mostrarErrorAcceso('CURP inválida: debe contener 18 caracteres con formato válido.');return}if(!/^\d{5}$/.test(d.cp)){mostrarErrorAcceso('El código postal debe tener 5 dígitos.');return}if(!/^\d{10}$/.test(d.celular)){mostrarErrorAcceso('El teléfono celular debe tener 10 dígitos.');return}if(!/^\S+@\S+\.\S+$/.test(d.email)){mostrarErrorAcceso('Correo electrónico inválido.');return}if(String(d.password).length<8||!/[a-z]/i.test(d.password)||!/\d/.test(d.password)){mostrarErrorAcceso('La contraseña debe tener mínimo 8 caracteres, letras y números.');return}if(d.password!==d.confirm){mostrarErrorAcceso('Las contraseñas no coinciden.');return}if(!d.privacy){mostrarErrorAcceso('Acepta el aviso de privacidad.');return}
// El consentimiento se lee del checkbox 'whatsapp'; se aplica a la cuenta recién creada.

// Nunca guardar CURP, dirección, teléfono, contraseña ni archivos en localStorage.
entrarCuenta('candidato',[d.nombre,d.paterno,d.materno].join(' '),String(d.email),d)
});
mostrarAcceso('login');

</script>
</body></html>
